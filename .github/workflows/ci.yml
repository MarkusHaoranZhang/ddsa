name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,learning,plot]

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src/dds_adapt

      - name: Test (pytest)
        run: pytest --maxfail=1

      - name: End-to-end smoke (reproduce.py --quick)
        run: python scripts/reproduce.py --quick --seed 0 --skip-figures --skip-learning
