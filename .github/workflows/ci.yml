name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,learning,plot]

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        # mypy is run only on Python 3.12, where pip resolves numpy 2.x.
        # The project supports numpy >= 1.24 at runtime (see pyproject),
        # but numpy 1.x ships less precise ndarray stubs (rank / dtype
        # erased), which makes assignments to typed arrays report
        # spurious ``[assignment]`` errors. The strict-mode static check
        # is meaningful only on the 2.x stubs the codebase was authored
        # against. Runtime compatibility with numpy 1.x is still
        # verified by the pytest / smoke steps below on py3.10.
        if: matrix.python-version == '3.12'
        run: mypy src/ddsa

      - name: Test (pytest)
        run: pytest --maxfail=1

      - name: End-to-end smoke (reproduce.py --quick)
        run: python scripts/reproduce.py --quick --seed 0 --skip-figures --skip-learning
