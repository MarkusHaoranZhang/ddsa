[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dds-adapt"
version = "0.1.0"
description = "Diagnosis-Driven Structural Adaptation for distributed satellite formation control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Haoran Zhang", email = "zhr@stu.xidian.edu.cn" },
    { name = "Lining Xing", email = "lnxing@xidian.edu.cn" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "mypy>=1.10",
]
learning = [
    "scikit-learn>=1.3",
]
plot = [
    "matplotlib>=3.7",
]

[project.scripts]
dds-run = "dds_adapt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # 行长由 formatter 控制
    "E741",  # 论文里就用了 l, I 这些单字母变量
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src/dds_adapt"]
strict = false
# We adopt a *gradual* mypy posture: warn loudly on the things that
# matter (untyped function defs that escape, missing returns, dead code)
# but do not require third-party stubs for numpy / scipy / matplotlib /
# sklearn (we treat them as ``Any``-typed where stubs are missing).
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "matplotlib.*"]
ignore_missing_imports = true
