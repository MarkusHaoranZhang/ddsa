[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddsa"
version = "0.1.0.dev0"
description = "Diagnosis-Driven Structural Adaptation for distributed satellite formation control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Haoran Zhang", email = "zhr@stu.xidian.edu.cn" },
    { name = "Lining Xing", email = "lnxing@xidian.edu.cn" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "mypy>=1.10",
]
learning = [
    "scikit-learn>=1.3",
]
plot = [
    "matplotlib>=3.7",
]

[project.scripts]
ddsa = "ddsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["_*.py", "_*.txt"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is governed by the formatter
    "E741",  # the paper uses single-letter names like l, I; allow them
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src/ddsa"]
strict = true
# numpy operations (mean, copy, clip, ...) return ``Any`` because numpy
# does not yet ship full generic stubs that preserve dtype. Disabling
# only ``no-any-return`` lets the rest of strict mode catch real bugs
# (untyped defs, missing return annotations, unreachable code) while
# avoiding cosmetic ``cast`` calls everywhere we return a numpy array.
disable_error_code = ["no-any-return"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "matplotlib.*"]
ignore_missing_imports = true
